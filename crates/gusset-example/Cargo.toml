[package]
name = "gusset-example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# A reference engine inside this workspace, depending on gusset by path.
publish = false

[lib]
# rlib only. Nothing links libgusset_example.a, and a second unsealed
# staticlib beside libgusset.a is the R14 failure this crate must not be.
crate-type = ["rlib"]

[dependencies]
gusset = { path = "../gusset" }

[dev-dependencies]
libc = "0.2"
