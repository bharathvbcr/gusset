[package]
name = "gusset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Production runtime contract for running Rust engines inside Go services: panic firewall, bounded concurrency, deadlines, poisoned handles, ABI verification, allocator accounting"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
keywords = ["cgo", "rust", "golang", "ffi", "concurrency"]
categories = ["api-bindings", "os::unix-apis", "concurrency"]
# Not a native library link: `links` is what lets the build script publish
# `DEP_GUSSET_ALLOCATOR_API` (always `1` since the 1.100 floor) to dependents.
# Kept so a dependent's `build.rs` that still reads it keeps working.
links = "gusset"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
static_assertions = "1.1"
libc = "0.2"

[build-dependencies]

[dev-dependencies]
# Already a direct dependency of this crate; the runtime tests need it to create
# pipes and probe descriptor state.
libc = "0.2"

[[test]]
name = "exports_match"
path = "../../tests/rust/exports_match.rs"

# Signature-level agreement between the hand-written gusset.h and the Rust
# exports. exports_match covers names only; this covers types.
[[test]]
name = "header_match"
path = "../../tests/rust/header_match.rs"

# Numbers duplicated across Rust, gusset.h and Go (status codes, flags, limits).
[[test]]
name = "constants_match"
path = "../../tests/rust/constants_match.rs"

[[test]]
name = "rust_runtime"
path = "../../tests/rust/rust_runtime.rs"

# Separate binary: registers engines in the process-global opcode registry,
# which rust_runtime promises never to touch.
[[test]]
name = "rust_deadline"
path = "../../tests/rust/rust_deadline.rs"

# Separate binary: registers a process-global engine handler whose panic
# payloads panic again on drop.
[[test]]
name = "rust_worker_containment"
path = "../../tests/rust/rust_worker_containment.rs"

# Separate binary: installs the counting global allocator.
[[test]]
name = "rust_status_overwrite"
path = "../../tests/rust/rust_status_overwrite.rs"

# Separate binary: shutdown latches a process-global flag that refuses every
# submission, which a parallel test in the same binary would observe.
[[test]]
name = "rust_shutdown"
path = "../../tests/rust/rust_shutdown.rs"

# Stable `Allocator` trait (Rust 1.100+): BufferAlloc, Counting as a local
# allocator, and zero-copy adoption of engine output. No global allocator, so
# the manual recorders are what is being measured.
[[test]]
name = "rust_allocator_api"
path = "../../tests/rust/rust_allocator_api.rs"

# Separate binary: installs the counting global allocator to prove BufferAlloc
# and Counting<Global> never count a byte twice.
[[test]]
name = "rust_allocator_counting"
path = "../../tests/rust/rust_allocator_counting.rs"

# Separate binary: restores SIGPIPE's default action process-wide, as a Go host
# has it for threads Go did not create.
[[test]]
name = "rust_sigpipe"
path = "../../tests/rust/rust_sigpipe.rs"

# Separate binary: flips the process-wide COUNTING_ACTIVE flag permanently.
[[test]]
name = "rust_counting_flip"
path = "../../tests/rust/rust_counting_flip.rs"

# Separate binary: live bytes are process-global. Proves catch_unwind drops a
# RawBuffer, and on Rust 1.100+ a BufferAlloc vector from try_reserve, without
# installing Counting. It does open a handle (gusset_handle_open) and closes it
# at the end: the registered-buffer cases need one.
[[test]]
name = "rust_unwind_reclaim"
path = "../../tests/rust/rust_unwind_reclaim.rs"

# In-process dispatch comparisons. A bench binary, not a second staticlib:
# the package still builds one libgusset and this target does not export a C ABI.
[[bench]]
name = "dispatch"
path = "benches/dispatch.rs"
harness = false

# The allocator accounting counters under parallel load (R10 instrument): only
# count_buffer_alloc and count_buffer_dealloc, from 1 to 8 threads.
[[bench]]
name = "alloc_counters"
path = "benches/alloc_counters.rs"
harness = false
