[package]
name = "gusset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Go-Rust runtime contract: panic firewall, bounded concurrency, deadlines, poisoned handles, ABI verification"
authors.workspace = true
# Not a native library link: `links` is what lets the build script publish
# `DEP_GUSSET_ALLOCATOR_API` to dependents, so an adopter gates its own
# `BufferAlloc` code on exactly the answer this crate compiled with.
links = "gusset"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
static_assertions = "1.1"
libc = "0.2"

[build-dependencies]

[dev-dependencies]
# Already a direct dependency of this crate; the runtime tests need it to create
# pipes and probe descriptor state.
libc = "0.2"

[[test]]
name = "exports_match"
path = "../../tests/exports_match.rs"

# Signature-level agreement between the hand-written gusset.h and the Rust
# exports. exports_match covers names only; this covers types.
[[test]]
name = "header_match"
path = "../../tests/header_match.rs"

# Numbers duplicated across Rust, gusset.h and Go (status codes, flags, limits).
[[test]]
name = "constants_match"
path = "../../tests/constants_match.rs"

[[test]]
name = "rust_runtime"
path = "../../tests/rust_runtime.rs"

# Separate binary: registers a process-global engine handler whose panic
# payloads panic again on drop.
[[test]]
name = "rust_worker_containment"
path = "../../tests/rust_worker_containment.rs"

# Separate binary: installs the counting global allocator.
[[test]]
name = "rust_status_overwrite"
path = "../../tests/rust_status_overwrite.rs"

# Separate binary: shutdown latches a process-global flag that refuses every
# submission, which a parallel test in the same binary would observe.
[[test]]
name = "rust_shutdown"
path = "../../tests/rust_shutdown.rs"

# Stable `Allocator` trait (Rust 1.100+): BufferAlloc, Counting as a local
# allocator, and zero-copy adoption of engine output. No global allocator, so
# the manual recorders are what is being measured.
[[test]]
name = "rust_allocator_api"
path = "../../tests/rust_allocator_api.rs"

# Separate binary: installs the counting global allocator to prove BufferAlloc
# and Counting<Global> never count a byte twice.
[[test]]
name = "rust_allocator_counting"
path = "../../tests/rust_allocator_counting.rs"

# Separate binary: restores SIGPIPE's default action process-wide, as a Go host
# has it for threads Go did not create.
[[test]]
name = "rust_sigpipe"
path = "../../tests/rust_sigpipe.rs"

# Separate binary: flips the process-wide COUNTING_ACTIVE flag permanently.
[[test]]
name = "rust_counting_flip"
path = "../../tests/rust_counting_flip.rs"
