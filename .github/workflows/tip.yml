name: Gusset Toolchain Tip

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  gotip:
    name: Go Tip Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust static library
        run: cargo build --release

      # Go tip (1.28) requires a bootstrap >= Go 1.26.0: src/make.bash sets
      # bootgo=1.26.0, and src/cmd/dist/notgo126.go is //go:build !go1.26.
      # Run 35594759554 died before any test, bootstrapping from the runner:
      #   Building Go cmd/dist using /opt/hostedtoolcache/go/1.24.13/x64. (go1.24.13 linux/amd64)
      #   found packages main (build.go) and building_Go_requires_Go_1_26_0_or_later (notgo126.go) in /home/runner/gotip/src/cmd/dist
      # make.bash takes the first `go` on PATH when GOROOT_BOOTSTRAP is unset,
      # and ubuntu-latest still has Go 1.24 in the toolcache. The pin matches
      # the matrix (1.27.x), which is ahead of that floor.
      - name: Set up Go bootstrap
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up Go Tip
        run: |
          gov="$(go env GOVERSION)"
          bootstrap="$(go env GOROOT)"
          echo "bootstrap ${gov} at ${bootstrap}"
          ver="${gov#go}"
          major="${ver%%.*}"
          minor="${ver#*.}"
          minor="${minor%%.*}"
          minor="${minor%%[^0-9]*}"
          if [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -lt 26 ]; }; then
            echo "bootstrap ${gov} is older than Go 1.26.0; src/cmd/dist/notgo126.go will refuse it" >&2
            exit 1
          fi
          git clone --depth=1 https://go.googlesource.com/go "$HOME/gotip"
          cd "$HOME/gotip/src" && GOROOT_BOOTSTRAP="$bootstrap" ./make.bash
          echo "$HOME/gotip/bin" >> "$GITHUB_PATH"
          # Subsequent steps must run this tree, not the bootstrap and not a
          # toolchain line in go.mod. GITHUB_ENV applies on the next step.
          echo "GOROOT=$HOME/gotip" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"

      - name: Confirm the test steps run on tip
        run: |
          go version
          case "$(go version)" in
            *devel*) ;;
            *)
              echo "expected a devel toolchain built from tip; got: $(go version)" >&2
              exit 1
              ;;
          esac
          if [ "${GOROOT:-}" != "$HOME/gotip" ]; then
            echo "GOROOT=${GOROOT:-<unset>} is not the tip tree at $HOME/gotip" >&2
            exit 1
          fi

      # The full unit and soak surface, not just `go test ./...`. A toolchain
      # change that breaks the thread-cap invariant would not show up in the
      # default run, and I4 is the property most likely to move under a scheduler
      # or cgo change.
      - name: Run Tests on Go Tip
        run: go test -v -timeout 30m ./...

      - name: Soak on Go Tip
        run: |
          go test -v -timeout 20m \
            -run 'TestPitfall_ThreadCapBoundedSoak|TestSoak_GoroutineLeakProfileIsEmptyAfterDrain' \
            ./tests/pitfalls/

      # The matrix said failure here opens an issue tagged `toolchain`. It did not:
      # the job just went red on a schedule nobody watches, which is the same as
      # not running. A scheduled job whose failure nobody sees is not a gate.
      - name: Open a toolchain issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Go tip breaks Gusset (run ${context.runId})`;
            const body = [
              'The weekly Go tip job failed.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
              '',
              'This is an upstream-compatibility signal, not necessarily a defect in',
              'this revision: Gusset pins cgo behaviour (`#cgo noescape`/`nocallback`),',
              'the `/sched/threads:threads` metric and the `goroutineleak` profile, and',
              'any of those can move at tip.',
            ].join('\n');

            // Reuse an open issue rather than filing one per week.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'toolchain',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['toolchain'],
            });
