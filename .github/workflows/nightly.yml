name: Gusset Nightly Sanity

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# AGENTS.md: nightly is "pinned by date, bumped monthly". It floated, so a gate
# could go red on a compiler change with no commit to blame — the allocator
# jobs did exactly that between nightly-2026-10-01 and -10-05. Bump this and
# RUST_NIGHTLY in matrix.yml together, in a commit of their own.
env:
  RUST_NIGHTLY: nightly-2026-10-05

jobs:
  miri:
    name: Miri Undefined Behavior Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust Nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          components: miri

      # This previously ran `cargo miri test -p gusset --lib alloc header` against a
      # library that contained no unit tests whatsoever, so Miri reported success
      # having executed nothing. The pure modules now carry real tests
      # (crates/gusset/src/header.rs and src/ffi/alloc.rs).
      #
      # Only --lib is checked: Miri cannot run the FFI exports or the worker threads,
      # and pretending otherwise is how a green job comes to mean nothing.
      - name: Confirm the lib actually has tests for Miri to run
        run: |
          count=$(cargo test -p gusset --lib -- --list 2>/dev/null | grep -c ': test$' || true)
          echo "lib unit tests: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::no lib unit tests; a Miri run over nothing is not a check"
            exit 1
          fi

      - name: Run Miri on pure modules
        env:
          # Instant::now() is a host clock read, which Miri refuses under isolation.
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          set -o pipefail
          cargo miri test -p gusset --lib 2>&1 | tee miri.txt
          # The pool tests carry #[cfg_attr(miri, ignore)] — Miri cannot run pipe(2)
          # or the worker threads — so "0 passed" is a reachable state if the pure
          # modules ever lose their tests. Assert on what actually executed, not
          # just on the exit code.
          passed=$(grep -oE '[0-9]+ passed' miri.txt | head -1 | grep -oE '[0-9]+')
          echo "miri executed: ${passed:-0} test(s)"
          if [ "${passed:-0}" -eq 0 ]; then
            echo "::error::Miri executed zero tests; the job proves nothing"
            exit 1
          fi

      # The ring's reader/publisher handshake is a Dekker pair; one seed can
      # schedule past a missing fence. park_handshake_never_loses_a_wake failed
      # on several of 32 seeds with the fence weakened to Acquire, and passed
      # all 32 on the real code — so the seed sweep is the check, not one run.
      - name: Miri seed sweep over the ring handshake
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-many-seeds=0..32
        run: cargo miri test -p gusset --lib pool::ring

  sanitizer:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust Nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          components: rust-src, llvm-tools

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      # The previous job built with ASan and stopped there, so nothing was ever
      # executed under the sanitizer. A build is not a check.
      #
      # The Rust suite is what ASan can meaningfully cover here: RawBuffer's manual
      # alloc/dealloc, the completion-pipe writes, and worker thread lifecycle.
      - name: Run the Rust suite under ASan
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
        run: |
          cargo test -p gusset -Zbuild-std \
            --target x86_64-unknown-linux-gnu \
            --test rust_runtime --test rust_shutdown \
            --test ffi_null_status --test engine_error_bounded \
            --test drain_logs_boundaries --test counting_global_buffers

      # BufferAlloc, Counting as an Allocator, and the adopted buffer's manual
      # dealloc(capacity, 64). Not under -Zbuild-std: the allocator probe cannot
      # see a build-std sysroot and would compile this path out, so the step
      # uses the prebuilt std and GUSSET_ALLOCATOR_API=1 fails the build rather
      # than silently testing the fallback.
      - name: Run the allocator suite under ASan
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          GUSSET_ALLOCATOR_API: '1'
          GUSSET_EXPECT_ALLOCATOR_API: '1'
        run: |
          cargo test -p gusset --target x86_64-unknown-linux-gnu \
            --test rust_allocator_api --test rust_allocator_counting --test rust_sigpipe

      # R4's deliberate cross-free, which this job named and did not have. Without
      # a violation ASan is supposed to catch, a green ASan run only shows the code
      # did not happen to trip the sanitizer — not that it was watching.
      #
      # The mechanism was verified directly: std::alloc with 64-byte alignment,
      # then libc free, then the owner's dealloc. ASan accepts the libc free (on
      # glibc a 64-byte-aligned block comes from posix_memalign, and freeing that
      # with free() is legal C) and reports the owner's subsequent release as
      # "attempting double-free". That second free is where R4's damage actually
      # lands, which is why the test drives both.
      #
      # go test -asan is linux-only; it is unsupported on darwin/arm64, so this
      # assertion cannot run on a developer Mac and the test reports SKIP there
      # rather than passing.
      - name: R4 cross-free must be detected
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          go test -asan -v -count=1 -timeout 10m \
            -run 'TestR4_CrossFreeIsDetectedUnderASan' ./tests/pitfalls/ | tee asan_go.txt
          if grep -q 'SKIP' asan_go.txt; then
            echo "::error::the cross-free test skipped under -asan; the asan build tag is not set"
            exit 1
          fi

  # The chaos hammer runs 2 s in every `go test`; that is a smoke test. Its
  # value is duration: the use-after-free and double-Wait park it found
  # (183b007) showed up a few times per minute, never in 2 s.
  hammer:
    name: Chaos hammer (long)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Build Rust release
        run: |
          cargo build --release
          go generate ./internal/ffi

      - name: Hammer under the race detector with GOGC=1
        run: GUSSET_STRESS=5m GOGC=1 go test -race -run Hammer -count=1 -timeout 30m -v .

      - name: Hammer without the race detector (more operations)
        run: GUSSET_STRESS=5m GOGC=1 go test -run Hammer -count=1 -timeout 30m -v .

  # libFuzzer targets over the Rust side of the boundary (fuzz/, its own
  # workspace): the log ring and drain, panic-payload truncation, ring slot
  # records, and arbitrary 40-byte call headers through a real job.
  cargo-fuzz:
    name: cargo-fuzz (Rust boundary)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust Nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz each target
        working-directory: fuzz
        run: |
          set -euo pipefail
          for t in log_ring truncate_payload ring_records call_header; do
            echo "== $t"
            cargo "+$RUST_NIGHTLY" fuzz run -O "$t" -- -max_total_time=300 -max_len=4096
          done

  # The per-push matrix fuzzes each Go target for 45 s; this gives each one
  # four minutes, where the timing-dependent reader targets find more.
  go-fuzz:
    name: Go fuzz (long)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Build Rust release
        run: |
          cargo build --release
          go generate ./internal/ffi

      - name: Fuzz every target
        run: make fuzz FUZZTIME=240s

      - name: Keep crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: go-fuzz-crashers
          path: |
            testdata/fuzz/
            tests/pitfalls/testdata/fuzz/

  # AGENTS.md: "nightly and tip failures open an issue automatically". tip did;
  # nightly did not, and on 2026-09-30 the chaos hammer took the test process
  # down with a SIGSEGV inside gusset_take that nobody was told about. Only on
  # main: a dispatch on a branch is someone already watching the run.
  report:
    name: Open an issue on failure
    needs: [miri, sanitizer, hammer, cargo-fuzz, go-fuzz]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const prefix = 'Nightly sanity failed';
            const failed = Object.entries(${{ toJSON(needs) }})
              .filter(([, job]) => job.result === 'failure')
              .map(([name]) => name);
            const body = [
              `Failed jobs: ${failed.join(', ')}`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: ${context.sha}`,
            ].join('\n');

            // One open issue collects every failing night instead of one per run.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug',
            });
            const existing = open.find((i) => i.title.startsWith(prefix));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${prefix} (run ${context.runId})`,
              body,
              labels: ['bug'],
            });

