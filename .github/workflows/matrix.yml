name: Gusset Matrix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run by hand on a branch, so a fix is verified before its PR exists.
  workflow_dispatch:

# Pinned by date per AGENTS.md; bump together with RUST_NIGHTLY in nightly.yml.
env:
  RUST_NIGHTLY: nightly-2026-10-05

jobs:
  unit:
    name: Unit & Pitfalls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # aarch64-unknown-linux-gnu is in the supported set, and `cross` only
        # type-checks it. It differs where it matters to an FFI crate: c_char
        # is unsigned there, which once made four `as *const u8` casts no-ops
        # that clippy -D warnings rejects on ARM Linux and nowhere else.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      # The lint job runs clippy on x86_64 Linux only, so cfg(target_os =
      # "macos") code and anything that depends on c_char's signedness was
      # never linted. Each platform lints the code it compiles.
      - name: Clippy on this platform
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Rust static library
        run: cargo build --release

      - name: Generate Go archive hash
        run: go generate ./internal/ffi

      # Covers the export check (R1), the runtime hardening suite, the shutdown
      # drain, and the adopter-engine test in crates/gusset-example.
      - name: Run Rust tests
        run: cargo test --workspace

      # AGENTS.md: the suite runs in both profiles. dev has overflow checks and
      # debug_assertions; release is what adopters link. Only the nightly
      # allocator-api job ran --release before, so the stable release path
      # adopters on 1.97/1.98 build was never tested in release.
      - name: Run Rust tests (release)
        run: cargo test --workspace --release

      # 1.27 has the goroutineleak profile, so the leak gate must run here,
      # never skip.
      - name: Run Go test suite (Panic Zoo & Pitfalls)
        env:
          GUSSET_REQUIRE_LEAK_PROFILE: '1'
        run: go test -v -timeout 10m ./...

      # Adopters may build with Go 1.27's SIMD experiment for their own
      # kernels; Gusset must keep working under it. Also checks that the SIMD
      # benchmark kernel agrees with the scalar Go and the Rust kernels.
      - name: Go suite under GOEXPERIMENT=simd
        env:
          GOEXPERIMENT: simd
        run: |
          go vet ./...
          go test -timeout 10m ./...
          go test -run SIMD -count=1 ./bench

  # go.mod declares Go 1.26 (latest minus one, per DECISIONS), and nothing
  # else here runs it: every other lane is 1.27. Build, vet and test on the
  # floor so a 1.27-only API or behaviour cannot slip in unnoticed.
  go-floor:
    name: Go 1.26 floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: Build Rust static library
        run: cargo build --release

      - name: Generate Go archive hash
        run: go generate ./internal/ffi

      - name: Vet and test on the floor
        env:
          GOTOOLCHAIN: local
        run: |
          go vet ./...
          go test -timeout 10m ./...

  # The Rust half of the same promise. AGENTS.md lists rust-version 1.97 as a
  # supported floor with a CI leg, and none existed: every other lane is stable,
  # nightly or the musl job's rustup stable, so the floor was checked only by
  # clippy's incompatible_msrv lint, which knows the std items that carry a
  # stability version and nothing else (language features, Cargo behaviour,
  # lints that changed). Build what adopters on 1.97 link and run both suites
  # against it.
  rust-floor:
    name: Rust 1.97 floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97'
          components: clippy, llvm-tools

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Build Rust static library
        run: cargo build --release

      - name: Generate Go archive hash
        run: go generate ./internal/ffi

      - name: Clippy on the floor
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust and Go tests on the floor
        run: |
          cargo test --workspace
          go test -timeout 10m ./...

  # The stable Allocator trait lands in Rust 1.100. Until that is the stable
  # channel, nightly carries it; switch `toolchain` to 1.100 once released. The
  # build probe decides per compiler, so GUSSET_ALLOCATOR_API=1 turns a silent
  # fallback into a build error and GUSSET_EXPECT_ALLOCATOR_API=1 makes the
  # fallback test fail too: this lane cannot pass without exercising the path.
  allocator-api:
    name: Allocator API (Rust 1.100+, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GUSSET_ALLOCATOR_API: '1'
      GUSSET_EXPECT_ALLOCATOR_API: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust (1.100+)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          # llvm-tools: exports_match reads the fat-LTO archive with llvm-nm;
          # Apple's nm cannot read newer-LLVM bitcode.
          components: clippy, llvm-tools

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Clippy with the allocator-aware surface compiled in
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Rust static library
        run: cargo build --release

      - name: Generate Go archive hash
        run: go generate ./internal/ffi

      - name: Rust tests (BufferAlloc, Counting as Allocator, zero-copy adoption)
        run: cargo test --workspace --release

      # The optimiser hides a slow test engine in --release; the nightly ASan job
      # runs this suite unoptimised against the 5 s ticket wait (issue #3).
      - name: Allocator suite in a debug build
        run: cargo test -p gusset --test rust_allocator_api

      - name: Go suite against the allocator-backed library
        run: go test -timeout 15m ./...

      - name: Go interop stress under the race detector
        run: go test -race -run 'TestInterop' -count=3 -timeout 15m ./tests/pitfalls/

      # Once stable reaches 1.100 no other job compiles the pre-1.100 path, so
      # force it here on the same compiler: every cfg(not(gusset_allocator_api))
      # branch keeps building and passing.
      - name: Fallback path on the same compiler (GUSSET_ALLOCATOR_API=0)
        env:
          GUSSET_ALLOCATOR_API: '0'
          GUSSET_EXPECT_ALLOCATOR_API: '0'
          CARGO_TARGET_DIR: target/fallback
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo build
          cargo test --workspace

  lint:
    name: Lint & Boundary Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      # --all-targets matters: without it clippy skips test targets entirely, and
      # the R3 disallowed-method rules went unenforced in exactly the code most
      # likely to reach for unwrap.
      - name: Cargo Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^bench/seed/' || true)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"; echo "$unformatted"; exit 1
          fi

      - name: Gussetvet Analyzer (R5)
        run: go run ./tools/gussetvet

      - name: Go Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Forbidden-pattern audit (R13 and the GODEBUG ban).
      #
      # Scoped to tracked Go and Rust sources. The previous version grepped the whole
      # tree, so it matched the rules as written in AGENTS.md and docs/PLAN.md — and
      # the patterns written into this very workflow file — and therefore failed on
      # every commit. A gate that can never pass is not a gate; it just trains people
      # to ignore a red job.
      #
      # R4 is deliberately NOT checked here. A blanket `grep -F C.free` cannot tell
      # a call from prose about the rule, and it hit the same wall a second time
      # once `tools/gussetvet` grew comments describing R4. `gussetvet` — which runs
      # a few steps above — strips comments, carries an explicit allowlist for the
      # one package permitted to hold the deliberate violation, and reports
      # file:line. Two enforcers for one rule means the cruder one eventually fires
      # on the stricter one's source.
      - name: Forbidden pattern audit
        run: |
          set -euo pipefail
          sources=$(git ls-files '*.go' '*.rs')
          fail=0
          check() {
            local pattern="$1" message="$2"
            local hits
            hits=$(printf '%s\n' "$sources" | xargs -r grep -nF -- "$pattern" || true)
            if [ -n "$hits" ]; then
              echo "::error::$message"
              echo "$hits"
              fail=1
            fi
          }
          check '//go:linkname' 'linkname forbidden (R13)'
          check 'asmcgocall'    'asmcgocall forbidden (R13)'
          check 'cgocheck=0'    'GODEBUG cgocheck=0 forbidden'
          check 'invalidptr=0'  'GODEBUG invalidptr=0 forbidden'
          # //nolint is golangci-lint syntax; staticcheck ignores it, so the
          # suppression silently does nothing and the lint job goes red (SA1012
          # in tests/pitfalls). Use `//lint:ignore <CHECK> <reason>` on the line
          # above instead.
          check '//nolint'      '//nolint is not honored by staticcheck; use //lint:ignore <CHECK> <reason>'
          exit $fail

      - name: Cargo Deny (licenses and advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  cgocheck2:
    name: cgocheck2 (R6, R16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build Rust release
        run: cargo build --release
      # R6 and R16 name this job as their enforcer. It was absent, so both rules
      # shipped with no gate at all: nothing checked that Rust never retains Go
      # memory past a call.
      - name: Go tests under cgocheck2
        run: GOEXPERIMENT=cgocheck2 go test -timeout 15m ./...

  memlimit:
    name: Memory Limit Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build Rust release
        run: cargo build --release
      - name: Allocator stats and AdviseMemoryLimit under a Go heap cap
        run: |
          GOMEMLIMIT=256MiB go test -v -run 'TestPitfall_AllocatorStatsAndLimit' \
            -timeout 10m ./tests/pitfalls/

  soak:
    name: Thread-Cap Soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Build Rust release
        run: cargo build --release

      - name: Run Soak Test
        run: go test -v -run TestPitfall_ThreadCapBoundedSoak -timeout 20m ./tests/pitfalls/...

  race:
    name: Race & Aggressive GC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Build Rust release
        run: cargo build --release

      # The root package is included: the chaos hammer and the waiter-handoff
      # and drain-exit tests live there, and race plus GOGC=1 is what found the
      # use-after-free and double-Wait park they guard (183b007).
      - name: Go Race Detector
        run: go test -race -v -timeout 20m . ./tests/pitfalls/... ./tests/panic_zoo/...

      # GOGC=1 marks far more aggressively, which is what shakes out a Buffer or
      # Handle being collected while Rust still holds the memory.
      - name: Aggressive GC Test
        run: GOGC=1 go test -v -count=5 -timeout 20m . ./tests/panic_zoo/... ./tests/pitfalls/...

  # R14's enforcer (docs/rfc-r14.md). A toolchain bump that changes what a naive
  # second staticlib does, or makes the COMDAT rename unnecessary, or breaks a
  # sealed engine beside libgusset.a, fails here instead of in an adopter.
  r14:
    name: R14 sealed staticlibs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Installed first so stable below stays the default; run.sh builds engine B
      # with `cargo +1.97` for the toolchain-skew scenario.
      - name: Set up Rust 1.97 (skew scenario)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # asan-rust builds libgusset.a and both engines with -Zsanitizer=address.
      # run.sh reads the same RUST_NIGHTLY pin; `toolchain install` leaves the
      # default alone. Go's -asan is linux-gnu only, so macOS reports n/a.
      - name: Install the pinned nightly (asan-rust scenario)
        if: runner.os == 'Linux'
        run: rustup toolchain install "$RUST_NIGHTLY" --profile minimal

      # x86_64-apple-darwin is in the supported set; the macOS runner is arm64,
      # so that leg runs under Rosetta. A missing Rosetta fails here rather
      # than skipping the architecture.
      - name: Add x86_64-apple-darwin (Rosetta leg)
        if: runner.os == 'macOS'
        run: |
          arch -x86_64 /usr/bin/true || { echo "::error::Rosetta is not available"; exit 1; }
          rustup target add x86_64-apple-darwin
          rustup target add --toolchain 1.97 x86_64-apple-darwin

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      # Platform-specific tests live in _linux/_darwin files, so no test skips on
      # a runner that has cc and ar; a skip means a check did not run, which is
      # not a pass. pipefail because an unset `shell:` is `bash -e` alone, and
      # tee would hide a failure.
      - name: gussetseal tests
        run: |
          set -o pipefail
          go test -count=1 -v ./tools/gussetseal | tee seal.txt
          if grep -q -- '--- SKIP' seal.txt; then
            echo "::error::a gussetseal test skipped"; exit 1
          fi

      # The host is its own module, so the lint job's `go vet ./...` never sees it.
      - name: Vet the harness host
        run: cd bench/r14/host && go vet .

      - name: R14 harness
        run: |
          set -o pipefail
          bench/r14/run.sh | tee r14.txt
          if grep -q '^SKIPPED' r14.txt; then
            echo "::error::an R14 scenario skipped"; exit 1
          fi

      - name: R14 harness, x86_64-apple-darwin under Rosetta
        if: runner.os == 'macOS'
        env:
          R14_TARGET: x86_64-apple-darwin
          GOARCH: amd64
        run: |
          set -o pipefail
          bench/r14/run.sh | tee r14-x86.txt
          if grep -q '^SKIPPED' r14-x86.txt; then
            echo "::error::an R14 scenario skipped"; exit 1
          fi

  # x86_64-unknown-linux-musl is in the supported set. Same container and
  # toolchain setup as the musl job below.
  r14-musl:
    name: R14 sealed staticlibs (musl)
    runs-on: ubuntu-latest
    container: golang:1.27-alpine
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          apk add --no-cache build-base musl-dev rustup binutils
          rustup-init -y --default-toolchain stable --profile minimal
          "$HOME/.cargo/bin/rustup" toolchain install 1.97 --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: gussetseal tests
        run: |
          set -o pipefail
          go test -count=1 -v ./tools/gussetseal | tee seal.txt
          if grep -q -- '--- SKIP' seal.txt; then
            echo "::error::a gussetseal test skipped"; exit 1
          fi

      - name: R14 harness
        run: |
          set -o pipefail
          bench/r14/run.sh | tee r14.txt
          if grep -q '^SKIPPED' r14.txt; then
            echo "::error::an R14 scenario skipped"; exit 1
          fi

  musl:
    name: musl (I5, R8)
    runs-on: ubuntu-latest
    container: golang:1.27-alpine
    steps:
      - uses: actions/checkout@v7

      # R8's only real enforcer. musl's default thread stack is 128 KiB against
      # 8 MiB on glibc and darwin, so a deep-recursion test anywhere else passes
      # whether or not Gusset set the stack size — it proves the platform, not the
      # runtime. This job is the one place the difference is in play.
      # Alpine's packaged rust is 1.96.1, below rust-version = "1.97", so
      # cargo refused to build (exit 101) on every run. rustup installs the
      # develop channel instead of lowering the floor.
      - name: Install toolchain
        run: |
          apk add --no-cache build-base musl-dev rustup
          rustup-init -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build Rust release
        run: cargo build --release

      - name: Deep recursion and worker stack sizing
        run: |
          go test -v -timeout 20m \
            -run 'TestPitfall_DeepRecursionOnWorkerStack|TestPitfall_ThreadCapBoundedSoak' \
            ./tests/pitfalls/

      # Reads the stack size back off the worker that ran the job. On musl this
      # fails loudly if the explicit 8 MiB request were ever dropped, instead of
      # waiting for a deep engine to overflow 128 KiB in production.
      - name: Worker stack is explicitly sized
        run: cargo test -p gusset --lib worker_stack_is_explicitly_sized_not_inherited -- --nocapture

  cross:
    name: Cross-compile (supported platform set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            x86_64-unknown-linux-gnu,
            aarch64-unknown-linux-gnu,
            x86_64-unknown-linux-musl,
            x86_64-apple-darwin,
            aarch64-apple-darwin

      # The matrix used to name a cross job covering windows/amd64-gnu that did
      # not exist. Gusset is unix-only by construction — POSIX pipe, sigaltstack,
      # pthread stack accounting — so the honest gate is to compile the platforms
      # that are actually supported and to assert the build *fails* on the ones
      # that are not. See docs/platforms.md.
      - name: Compile every supported target
        run: make cross

      - name: Windows must fail with a named error, not a symbol cascade
        run: |
          rustup target add x86_64-pc-windows-msvc
          if cargo check -p gusset --target x86_64-pc-windows-msvc 2>err.txt; then
            echo "::error::a Windows build succeeded; docs/platforms.md says it cannot"
            exit 1
          fi
          if ! grep -q "gusset supports unix targets only" err.txt; then
            echo "::error::Windows build failed, but not with the declared platform error"
            cat err.txt
            exit 1
          fi
          echo "Windows correctly refused with the declared error"

  bench:
    name: Benchmarks (R15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      # R15 named this job and it did not exist: `make docs` printed
      # "Documentation up to date" and regenerated nothing, while the README's
      # figures disagreed with benchstat over the very file they cited.
      - name: README numbers are generated, not hand-written
        run: make docs-check

      # Old and new are built once and then run alternately, ten rounds each,
      # so runner drift (thermal, noisy neighbours, cache state) lands on both
      # sides instead of on whichever ran second. The base is the PR's base or,
      # on a push, the commit the push replaced. It used to be
      # origin/${base_ref || main}, which on a push to main is the pushed
      # commit itself: the job measured identical code twice in a row and
      # failed on "+137%" of noise.
      - name: Build this revision and its base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "no base revision to compare against; the regression gate cannot run" >&2
            echo "BENCH_BASE=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "BENCH_BASE=$BASE_SHA" >> "$GITHUB_ENV"
          cargo build --release
          go test -c -o "$RUNNER_TEMP/new.test" ./bench
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          (cd "$RUNNER_TEMP/base" && cargo build --release && go test -c -o "$RUNNER_TEMP/old.test" ./bench)

      - name: Benchmark both, interleaved
        if: env.BENCH_BASE != ''
        run: |
          set -euo pipefail
          : > old.txt
          : > new.txt
          for _ in $(seq 10); do
            (cd "$RUNNER_TEMP/base/bench" && "$RUNNER_TEMP/old.test" -test.run '^$' -test.bench . -test.benchtime=1s -test.count=1) >> old.txt
            (cd bench && "$RUNNER_TEMP/new.test" -test.run '^$' -test.bench . -test.benchtime=1s -test.count=1) >> new.txt
          done

      # benchstat exits non-zero only on error, so the threshold is applied here:
      # a row that regressed more than 10% fails the job rather than being printed
      # into a log nobody reads.
      - name: Compare and enforce the 10% threshold
        if: env.BENCH_BASE != ''
        run: |
          benchstat old.txt new.txt | tee delta.txt
          if grep -qE '\+[1-9][0-9]{1,}\.[0-9]+%' delta.txt; then
            echo "::error::a benchmark regressed by more than 10%"
            exit 1
          fi
          echo "no regression beyond 10%"

      - name: Benchmark this revision
        if: env.BENCH_BASE == ''
        run: |
          cargo build --release
          go test -bench . -benchtime=1s -count=10 ./bench/... | tee new.txt

      # R5's noescape claim is only worth something if the allocation count it
      # enables is actually held.
      - name: Channel-hop baseline must stay at zero allocations
        run: |
          benchstat new.txt | tee summary.txt
          grep -E 'ChannelHop' summary.txt

  fuzz:
    name: Fuzz the FFI boundary
    runs-on: ubuntu-latest
    # 13 targets; a per-push smoke. The nightly go-fuzz job runs each longer.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build Rust release
        run: cargo build --release

      # The matrix named `cargo fuzz run header` and a Go `FuzzStatus`, and neither
      # existed. These use Go's native fuzzing: no dependency to add, and it points
      # straight at the boundary where untrusted bytes actually enter.
      - name: Fuzz
        run: make fuzz FUZZTIME=45s

      # A crasher is written to testdata/, which would otherwise be lost with the
      # runner.
      - name: Upload any crashers
        if: failure()
